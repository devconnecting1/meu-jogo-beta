name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (roblox-ts)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Upload compiled Luau
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          if-no-files-found: error

      - name: Upload rbxts include
        uses: actions/upload-artifact@v4
        with:
          name: include
          path: include/
          if-no-files-found: error
