name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Settings > About shows the version: src/shared/version.ts is generated from package.json (`npm run stamp`) and
      # committed with GAME_BUILD "dev"; the CI checks that copy, then stamps its own with the commit it builds (never
      # committed back), so the place from Actions says which commit it is
      - name: Version stamp (version.ts matches package.json; this build carries its commit)
        run: |
          npm run stamp
          git diff --exit-code -- src/shared/version.ts
          node tools/gen-version.mjs --build "${GITHUB_SHA::7}"

      - name: Typecheck (roblox-ts)
        run: npm run build

      # the pinned official Luau compiler (tools/luauRelease.mjs) against every out/**/*.luau: the real load-time
      # limits (200 locals, registers, constants...), not the text heuristic check:registers falls back to
      - name: Luau CLI check (real compiler; catches every load-time limit, not just locals)
        run: npm run check:luau

      - name: Luau register budget (a module chunk may hold 200 locals)
        run: npm run check:registers

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # the 5 reference towns and 20 more from seeds drawn as a world reset draws them (MP-22 picks ANY seed): the
      # interiors must leave no hiding spot in any town a player can get (EDI-11), not just in the 5 we look at
      - name: World design rules (docs/DESIGN_RULES.md [auto]) + a 20-seed sweep
        run: npm run validate:world -- --sweep 20

      # UI-01: colours come from design/tweakcn-theme.json through `npm run theme`, never from a hand edit
      - name: Theme pipeline (themeTokens.ts really is the generated file)
        run: |
          npm run theme
          git diff --exit-code -- src/client/ui/themeTokens.ts

      - name: Colour contrast (WCAG 4,5:1 for text, 3:1 for outlines and bars)
        run: npm run test:contrast

      - name: The Bag is built once (tab switches and actions create no Instances)
        run: npm run test:backpack

      - name: The HUD console (600 frames without creating an Instance, hotbar = keys 1-5, click = key, touch uncovered)
        run: npm run test:hud

      # UI-06: no menu pauses the world -- the client's own input with the Bag open, against the real server
      - name: No menu pauses the world (Bag open, the horde, the clock and the damage go on; the hit flash)
        run: npm run test:menus

      - name: Cosmetics are drawn (outfits, pets that follow, the wardrobe preview; MON-04)
        run: npm run test:cosmetics

      # IA-05: the blue dot, the gold "?" and the red "!" over the horde, measured on every ground and at night
      - name: Zombie awareness marks (shape + colour, LEG-03 contrast, never over a survivor, Reduce Motion, no churn)
        run: npm run test:awareness

      - name: Night light map (cost per frame, High looks the same, lightAt agrees, Low never tears, Auto hysteresis)
        run: npm run test:light

      - name: A struck tree or car stops shaking (every client-side flinch is aged by one clock)
        run: npm run test:flinch

      # UI-07 / UI-10 / UI-06: windows centred on the full screen, the town behind every menu, the world behind a run's
      - name: Menu screens (centred clear of the Roblox buttons; the town flyover pinned behind every menu)
        run: npm run test:screens

      - name: Lobby and Survivor screen (UI-10; the town behind them without creating Instances once warm)
        run: npm run test:lobby

      # every Settings row followed to its real effect: the mixer, the HUD size, the touch geometry, the keys, the save
      - name: Settings do what they say (audio, HUD size, touch layout, every SCHEMES key, Defaults, persistence)
        run: npm run test:settings

      # every menu walked as a player would; the pad; achievements and records; every string in lang.ts and the CSV
      - name: Menus and strings (open / close / focus without leaks, the pad, achievements, lang.ts and the locale CSV)
        run: npm run test:nav

      # UI-12 / MP-23: the kit's Table and forms, the admin panel, Records and the match scoreboard
      - name: Tables and forms (row pools without churn, nothing sent while a field is wrong, the scoreboard)
        run: npm run test:tables

      # ART-01..06: worldArtAssets.ts is the generated file, and the town's art only ever adds to the flat town
      - name: Town art (no id = the flat town unchanged, textures, no churn, LEG-03 legibility, render tool)
        run: |
          npm run art:world -- --no-sheet
          git diff --exit-code -- src/client/view/worldArtAssets.ts design/world-art/manifest.json
          npm run test:world-art

      # the world renderer's pool: one sub-pool per ZIndex, no ZIndex write in steady state, the lobby warm-up
      - name: Renderer pool (same draw order, a birth or death costs O(1), no ZIndex writes, warm-up without churn)
        run: npm run test:pool

      - name: Net protocol tests (round-trip, limits, fuzz)
        run: npm run test:net

      - name: Simulation determinism (client prediction must match the server)
        run: npm run test:sim

      - name: Server simulation (authority, input abuse, hostile payloads)
        run: npm run test:server-sim

      - name: Client prediction (divergence under latency, loss and reordering)
        run: npm run test:predict

      - name: Input queue (how often the server's queue runs dry with the real sender over a jittery link)
        run: npm run test:input

      - name: Replication (three clients, one horde; interest, bandwidth and tick cost)
        run: npm run test:replication

      - name: Zombie AI (perception, alert, flanking, pace director, cost)
        run: npm run test:ai

      - name: Authoritative combat (hit validation, rewind, cadence, server-side progress)
        run: npm run test:combat

      - name: Match clock and night waves (one server clock, lossy client, the original headcount)
        run: npm run test:clock

      - name: World day vs life day, the daybreak wait and the runRev retry (MP-13, MP-20, MP-21)
        run: npm run test:life

      - name: The body is the server's (Leave/Enter, reconnect, Rebirth, New game, daybreak, the world wipe)
        run: npm run test:body

      - name: Admin world tools on the server (auth, validation, every op, audit, flood kick, reset body, the panel)
        run: npm run test:admin

      - name: The world ends when everyone is dead (MP-22 -- a new town on day 1, the world log; New game is a new life)
        run: npm run test:reset

      - name: Night waves end to end (queue -> real spawner -> zombie, the sterile world, the daybreak revive)
        run: npm run test:waves

      - name: Analytics (onboarding funnel once and in order, economy balances, no per-kill event, under the rate cap)
        run: npm run test:analytics

      - name: World on the server (items, doors, building, loot, the outbox and its audiences; F3)
        run: npm run test:world

      - name: Save v3 (migration from v2, rollback, and every field survives copySaveInto)
        run: npm run test:save

      - name: Every item row by row (weapons, equipment, usables, recipes, skills, loot, shop; known bugs listed)
        run: npm run test:items

      - name: Footstep cadence (the walk cycle drives the sound)
        run: npm run test:footsteps

      - name: Audio (the catalogue, world sounds on the wire, loops that always end, no spam, 10 minutes without churn, our own SFX banks, upload-audio)
        run: npm run test:audio

      - name: Remote smoothing (an ally is drawn continuously, not in snapshot steps)
        run: npm run test:smoothness

      - name: The horde as drawn (server -> wire -> client -> camera -> pixel; clean link, WAN, Studio frames)
        run: npm run test:zombie-motion

      - name: Proximity chat (earshot, presence and the bubble stack)
        run: npm run test:chat

      - name: Upload compiled Luau
        uses: actions/upload-artifact@v6
        with:
          name: out
          path: out/
          if-no-files-found: error

      - name: Upload rbxts include
        uses: actions/upload-artifact@v6
        with:
          name: include
          path: include/
          if-no-files-found: error

      - name: Install Rojo
        run: |
          curl -L -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          mkdir -p "$HOME/.local/bin"
          unzip -o rojo.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rojo build
        run: $HOME/.local/bin/rojo build -o ProjectZ-ci.rbxl

      # place properties a script cannot set (Players.BanningEnabled for the admin's Ban API): a fresh build must carry
      # them, or every publish silently resets them to the engine default
      - name: Place properties survive a fresh build (bans enabled, TextChatService)
        run: |
          $HOME/.local/bin/rojo build -o ProjectZ-ci.rbxlx
          node tools/check-place.mjs ProjectZ-ci.rbxlx

      - name: Upload place file
        uses: actions/upload-artifact@v6
        with:
          name: place
          path: ProjectZ-ci.rbxl
          if-no-files-found: error
