name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (roblox-ts)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Upload compiled Luau
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          if-no-files-found: error

      - name: Upload rbxts include
        uses: actions/upload-artifact@v4
        with:
          name: include
          path: include/
          if-no-files-found: error

      - name: Install Rojo
        run: |
          curl -L -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -o rojo.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rojo build
        run: $HOME/.local/bin/rojo build -o ProjectZ-ci.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: place
          path: ProjectZ-ci.rbxl
          if-no-files-found: error
