name: World sweep

# Every [auto] rule of docs/DESIGN_RULES.md (npm run validate:world) over 200 towns the CI has never seen, once a week
# (Sunday; 600 a night was ~1,800 Actions minutes a month, the whole free allowance of a private repo):
# a world reset (MP-22) lands on ANY seed, and the CI's fixed spreads (ci.yml `build` and `world-sweep`, 145 towns) only
# ever look at the same ones. Two shards of 100 towns, each from its own spread of that day (the date, UTC), so a red
# run names the seeds and each one repeats with `npm run validate:world -- <seed>`. Never on a push or a pull request:
# a town that fails here is the generator's, not the change's -- fix it, then add its spread to ci.yml if it teaches
# something. Run workflow (Actions -> World sweep) takes a spread and a count of your own.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      base:
        description: "Spread (a whole number; empty: today's date, UTC). Shard k walks base * 4 + k"
        type: string
        default: ""
      count:
        description: "Towns per shard (two shards)"
        type: number
        default: 100

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the inputs reach the script only through the env, and only as whole numbers
      - name: World design rules over one shard of the day's towns
        env:
          BASE_INPUT: ${{ inputs.base }}
          COUNT_INPUT: ${{ inputs.count }}
          SHARD: ${{ matrix.shard }}
        run: |
          base="${BASE_INPUT:-$(date -u +%Y%m%d)}"
          count="${COUNT_INPUT:-100}"
          case "$base$count" in
            *[!0-9]*) echo "::error::base and count must be whole numbers"; exit 1 ;;
          esac
          spread=$(( base * 4 + SHARD ))
          echo "spread $spread: $count towns (npm run validate:world -- --sweep $count --sweep-base $spread)"
          set -o pipefail
          status=0
          npm run validate:world -- --sweep "$count" --sweep-base "$spread" 2>&1 | tee sweep.log || status=$?
          # the job's summary: each failing town (its seed) and each failure, and the verdict
          {
            echo "### Spread $spread, $count towns"
            echo '```'
            grep -E '^seed [0-9]+: [0-9]+ failure|^    [A-Z]+-[0-9]+ |^  [A-Z]+-[0-9]+ \(run\)|^(PASS|FAIL):' sweep.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
